<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace SEG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f8b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html{background:radial-gradient(circle at 12% 8%,rgba(34,211,238,.35),transparent 45%),radial-gradient(circle at 90% 92%,rgba(236,72,153,.3),transparent 48%),linear-gradient(160deg,#1e1b4b,#4338ca 58%,#7c3aed) fixed;background-color:#1e1b4b}
html body{--card:rgba(255,255,255,.1);--bg:rgba(255,255,255,.1);--tx:#f5f3ff;--mut:#c9c6f2;--ac:#8b7cf8;--ac2:#22d3ee;--bd:rgba(255,255,255,.22);--ok:#86efac;--bad:#fca5a5;background:transparent;color-scheme:dark;min-height:100vh}
html body .card,html body .tabs button{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html body .pad{background:rgba(30,27,75,.94)}
html body .pubbtn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 18px rgba(99,102,241,.4)}
html body .fm{color:#a5f3fc}
html body select option{color:#111}
:root{--bg:#f3f5f7;--card:#fff;--tx:#14213d;--mut:#5f6b7a;--ac:#1f6f8b;--ac2:#e07a1f;--bd:#dde2e8;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18222f;--tx:#e8edf3;--mut:#9aa7b6;--ac:#5bb3d0;--ac2:#f0a04b;--bd:#2a3646;--ok:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18222f;--tx:#e8edf3;--mut:#9aa7b6;--ac:#5bb3d0;--ac2:#f0a04b;--bd:#2a3646;--ok:#69db7c;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.low{color:var(--bad)}.good{color:var(--ok)}
.empty{color:var(--mut);padding:8px 0}
select,input{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row input,.row select{flex:1 1 130px}
button.act{padding:9px 14px;border:0;border-radius:8px;background:var(--ac2);color:#14213d;font:inherit;font-weight:700;cursor:pointer}
button.pub{background:var(--ac);color:#fff}
button.pub:disabled{opacity:.45;cursor:default}
button.x{border:0;background:none;color:var(--bad);font-size:1.1rem;cursor:pointer;padding:0 6px}
.adm{border-left:4px solid var(--ac2);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.adm p{margin:0;font-size:.9rem}
.big{font-size:1.6rem;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(4px)}
.pad{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px 20px 18px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pad h2{margin:0 0 4px;font-size:1.2rem}
.pad p{margin:0 0 16px;color:var(--mut);font-size:.9rem;min-height:1.4em}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 20px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ac);display:block}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:60px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:600 1.5rem system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.keys button:active{background:var(--ac);border-color:var(--ac);color:#fff}
.keys .ok{background:var(--ac2);border-color:var(--ac2);color:#14213d}
.pad .cancel{margin-top:14px;background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 12px}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.pubbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 22px;border:0;border-radius:14px;font:700 1.05rem system-ui,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f6f8b,#2b94b8);box-shadow:0 6px 18px rgba(31,111,139,.35);transition:transform .15s,box-shadow .15s,background .3s}
.pubbtn:active{transform:scale(.97)}
.pubbtn:disabled{opacity:.5;cursor:default;box-shadow:none}
.pubbtn.ok{background:linear-gradient(135deg,#2b8a3e,#40a65a)}
.pubbtn.ok:disabled{opacity:1}
.pubbtn.err{background:linear-gradient(135deg,#c92a2a,#e04b4b)}
.pubbtn svg{width:22px;height:22px;flex:none}
.spin{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
details.card summary{cursor:pointer;list-style:none;padding:4px 0}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";float:right;color:var(--mut)}
details[open].card summary::after{content:"▴"}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.fr span{flex:1;min-width:0;font-size:.92rem}
.fr input.sc{width:88px;text-align:right;flex:none}
.fr input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac2);flex:none;padding:0}
.fm{margin:10px 0 0;font-size:.9rem;font-weight:600;color:var(--ac)}
.fm.er{color:var(--bad)}
.ed{background:none;border:1px solid var(--ac2);color:var(--ac2);border-radius:8px;padding:3px 8px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
tr.edit td{background:rgba(34,211,238,.18)}
.stt{flex:none;font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.stt:empty{display:none}
.stt.d{background:var(--ok);color:#052e16}
.stt.m{background:#fbbf24;color:#451a03}
.stt.n{border:1px solid var(--bd);color:var(--mut)}
.fr input.sc.d{border-color:var(--ok)}
.fr input.sc.m{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.25)}
.grp{font-weight:700;color:var(--ac2);margin:10px 0 4px}
</style>
</head>
<body>
<main>
<h1>Mon espace SEG</h1>
<p class="sub" id="upd"></p>
<div id="app"></div>
</main>
<script>
let D={updated:"",students:[],notes:[],devoirs:[],absences:[]};const LS="seg_admin_draft";
let pst="idle",tab="notes",admin=false,dirty=false,sel="all",msg="";
let PUBIDS=new Set(),maskOK=false;const OF={};
let EDIT=null,ARQ="";
const PM="97762850eab9c2e1b9d2dc7dcb0c99e732d51305b01aaef2ffc3364f5b459a9f";
const $=id=>document.getElementById(id);
const g=id=>($(id)?$(id).value.trim():"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const sname=id=>(D.students.find(s=>s.id===id)||{name:"?"}).name;
const fd=d=>d?d.split("-").reverse().join("/"):"";
const opts=selId=>[...D.students].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(s=>'<option value="'+s.id+'"'+(s.id===selId?" selected":"")+'>'+esc(s.name)+'</option>').join("");
const del=(k,id)=>admin?'<button class="x" data-a="del" data-k="'+k+'" data-i="'+id+'" title="Supprimer">✕</button>':"";
const delN=id=>admin?'<button class="x" data-a="delnote" data-i="'+id+'" title="'+(PUBIDS.has(id)?"Archiver (reste visible chez les étudiants)":"Supprimer")+'">✕</button>':"";
const edB=id=>admin?'<button class="ed" data-a="editn" data-i="'+id+'">'+(EDIT===id?"✏️ En cours…":"✏️ Modifier")+'</button> ':"";
const nk=s=>norm(s).trim().replace(/\s+/g," ");
function findNote(sid,sub,ti,exceptId){return D.notes.find(n=>n.sid===sid&&nk(n.subject)===nk(sub)&&nk(n.title)===nk(ti)&&n.id!==exceptId);}

function archHTML(hid){
  if(!hid.length)return '<p class="empty">Aucune note archivée.</p>';
  const subs=[...new Set(hid.map(n=>n.subject||"Sans matière"))].sort((a,b)=>a.localeCompare(b,"fr"));
  let h='<div class="row"><input id="ar_q" data-ar="1" type="search" placeholder="🔍 Rechercher un étudiant ou une matière" value="'+esc(ARQ)+'"></div><div style="margin-top:10px">';
  h+=subs.map(s=>{
    const r=hid.filter(n=>(n.subject||"Sans matière")===s);
    const M=new Map();
    r.forEach(n=>{const k=JSON.stringify([n.title,n.teacher||"",n.date]);if(!M.has(k))M.set(k,{t:n.title,e:n.teacher||"",d:n.date,rows:[]});M.get(k).rows.push(n);});
    const G=[...M.values()].sort((a,b)=>b.d.localeCompare(a.d));
    return '<details class="card" data-sf="A:'+esc(s)+'" '+(OF["A:"+s]?"open":"")+'><summary><b>📁 '+esc(s)+'</b> <span class="sub">· '+r.length+' note(s)</span></summary>'+G.map(x=>'<div class="grp">'+esc(x.t)+(x.e?' · '+esc(x.e):'')+' · '+fd(x.d)+'</div><div class="scroll"><table><tr><th>Étudiant</th><th>Note</th><th></th></tr>'+x.rows.map(n=>'<tr data-ar-nm="'+esc(norm(sname(n.sid)+" "+(n.subject||"")))+'"><td>'+esc(sname(n.sid))+'</td><td class="num '+(n.score/n.max<.5?"low":"good")+'">'+n.score+'/'+n.max+'</td><td><button class="ghost" data-a="unh" data-i="'+n.id+'">Réafficher</button></td></tr>').join("")+'</table></div>').join("")+'</details>';
  }).join("");
  return h+'</div>';
}
function applyAR(){
  const q=norm(ARQ);
  document.querySelectorAll("details[data-sf^='A:']").forEach(d=>{
    let any=false;
    d.querySelectorAll("tr[data-ar-nm]").forEach(r=>{const ok=!q||r.dataset.arNm.includes(q);r.style.display=ok?"":"none";if(ok)any=true;});
    d.style.display=any?"":"none";
  });
}

function vNotes(){
  const all=D.notes.filter(n=>sel==="all"||n.sid===sel).sort((a,b)=>b.date.localeCompare(a.date));
  let avg="";
  if(sel!=="all"&&all.length){
    const m=all.reduce((t,n)=>t+n.score/n.max*20,0)/all.length;
    avg='<p>Moyenne sur 20 : <span class="big">'+m.toFixed(2).replace(".",",")+'</span></p>';
  }
  let h='<div class="card"><select id="flt"><option value="all">Toute la classe</option>'+opts()+'</select>'+avg+'</div>';
  if(!admin){
    const subs=[...new Set(all.map(n=>n.subject||"Sans matière"))].sort((a,b)=>a.localeCompare(b,"fr"));
    h+=subs.length?subs.map(s=>{
      const r=all.filter(n=>(n.subject||"Sans matière")===s);
      const m=r.reduce((t,n)=>t+n.score/n.max*20,0)/r.length;
      return '<details class="card" data-sf="'+esc(s)+'" '+(OF[s]?"open":"")+'><summary><b>📁 '+esc(s)+'</b> <span class="sub">· '+r.length+' note(s) · Moyenne '+m.toFixed(2).replace(".",",")+'/20</span></summary><div class="scroll"><table><tr><th>Étudiant</th><th>Interro</th><th>Docteur</th><th>Note</th><th>Date</th></tr>'+r.map(n=>'<tr><td>'+esc(sname(n.sid))+'</td><td>'+esc(n.title)+'</td><td>'+esc(n.teacher||"")+'</td><td class="num '+(n.score/n.max<.5?"low":"good")+'">'+n.score+'/'+n.max+'</td><td>'+fd(n.date)+'</td></tr>').join("")+'</table></div></details>';
    }).join(""):'<div class="card"><p class="empty">Aucune note pour le moment.</p></div>';
    return h;
  }
  const rows=all.filter(n=>!n.h);
  h+='<div class="card">';
  h+=rows.length?'<div class="scroll"><table><tr><th>Étudiant</th><th>Matière</th><th>Interro</th><th>Docteur</th><th>Note</th><th>Date</th><th></th></tr>'+rows.map(n=>'<tr'+(EDIT===n.id?' class="edit"':'')+'><td>'+esc(sname(n.sid))+'</td><td>'+esc(n.subject)+'</td><td>'+esc(n.title)+'</td><td>'+esc(n.teacher||"")+'</td><td class="num '+(n.score/n.max<.5?"low":"good")+'">'+n.score+'/'+n.max+'</td><td>'+fd(n.date)+'</td><td>'+edB(n.id)+delN(n.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucune note affichée.</p>';
  if(rows.length)h+='<div class="row"><button class="ghost" data-a="arch">Tout archiver ('+rows.length+')</button></div>';
  h+='</div>';
  const hid=D.notes.filter(n=>n.h&&(sel==="all"||n.sid===sel));
  h+='<div class="card"><button class="ghost" data-a="showh">'+(maskOK?"Cacher les archives":"Voir les notes archivées ("+D.notes.filter(n=>n.h).length+")")+'</button>';
  if(maskOK)h+=archHTML(hid);
  h+='</div>';
  h+=fastNotes();
  const E=EDIT?D.notes.find(n=>n.id===EDIT):null;
  if(EDIT&&!E)EDIT=null;
  h+='<div class="card" id="nform"><b>'+(E?'Modifier la note de '+esc(sname(E.sid)):'Ajouter une note')+'</b><div class="row"><select id="n_s">'+opts(E?E.sid:"")+'</select><input id="n_m" placeholder="Matière" value="'+(E?esc(E.subject):"")+'"><input id="n_t" placeholder="Intitulé (ex. Interro 2)" value="'+(E?esc(E.title):"")+'"><input id="n_e" placeholder="Docteur (ex. Dr Koffi)" value="'+(E?esc(E.teacher||""):"")+'"><input id="n_sc" type="number" step="0.25" placeholder="Note" value="'+(E?E.score:"")+'"><input id="n_x" type="number" value="'+(E?E.max:20)+'" placeholder="Sur"><input id="n_d" type="date" value="'+(E?esc(E.date):today())+'"></div><div class="row">'+(E?'<button class="act" data-a="savee">Enregistrer la modification</button><button class="ghost" data-a="cancele">Annuler</button>':'<button class="act" data-a="addn">Ajouter la note</button>')+'</div></div>';
  return h;
}
function vDevoirs(){
  const rows=[...D.devoirs].sort((a,b)=>a.due.localeCompare(b.due));
  let h='<div class="card">';
  h+=rows.length?'<div class="scroll"><table><tr><th>À rendre le</th><th>Matière</th><th>Devoir</th><th></th></tr>'+rows.map(d=>'<tr><td class="num">'+fd(d.due)+'</td><td>'+esc(d.subject)+'</td><td>'+esc(d.title)+'</td><td>'+del("devoirs",d.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucun devoir à rendre.</p>';
  h+='</div>';
  if(admin)h+='<div class="card"><b>Ajouter un devoir</b><div class="row"><input id="d_m" placeholder="Matière"><input id="d_t" placeholder="Devoir à faire"><input id="d_d" type="date" value="'+today()+'"></div><div class="row"><button class="act" data-a="addd">Ajouter le devoir</button></div></div>';
  return h;
}
function vAbs(){
  const tot=D.students.map(s=>({s,h:D.absences.filter(a=>a.sid===s.id).reduce((t,a)=>t+a.hours,0)})).sort((a,b)=>b.h-a.h);
  let h='<div class="card"><b>Total par étudiant</b><div class="scroll"><table><tr><th>Étudiant</th><th>Heures d’absence</th></tr>'+tot.map(t=>'<tr><td>'+esc(t.s.name)+'</td><td class="num '+(t.h>=10?"low":"")+'">'+t.h+' h</td></tr>').join("")+'</table></div></div>';
  const rows=[...D.absences].sort((a,b)=>b.date.localeCompare(a.date));
  h+='<div class="card"><b>Détail</b>'+(rows.length?'<div class="scroll"><table><tr><th>Date</th><th>Étudiant</th><th>Heures</th><th>Motif</th><th></th></tr>'+rows.map(a=>'<tr><td>'+fd(a.date)+'</td><td>'+esc(sname(a.sid))+'</td><td class="num">'+a.hours+' h</td><td>'+esc(a.reason||"")+'</td><td>'+del("absences",a.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucune absence enregistrée.</p>')+'</div>';
  if(admin)h+=fastAbs();
  if(admin)h+='<div class="card"><b>Ajouter une absence</b><div class="row"><select id="b_s">'+opts()+'</select><input id="b_h" type="number" step="0.5" placeholder="Heures"><input id="b_d" type="date" value="'+today()+'"><input id="b_r" placeholder="Motif (facultatif)"></div><div class="row"><button class="act" data-a="addb">Ajouter l’absence</button></div></div>';
  return h;
}
function vStud(){
  let h='<div class="card"><b>Étudiants de la classe ('+D.students.length+')</b><table>'+[...D.students].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+del("students",s.id)+'</td></tr>').join("")+'</table></div>';
  if(admin)h+='<div class="card"><b>Ajouter des étudiants</b><p class="sub">Un nom par ligne : tu peux coller toute la liste de la classe d’un coup.</p><textarea id="s_n" rows="6" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)" placeholder="Nom Prénom"></textarea><div class="row"><button class="act" data-a="adds">Ajouter</button></div></div>';
  return h;
}
function render(){
  $("upd").textContent=D.updated?"Dernière mise à jour : "+D.updated:"Pas encore mis à jour";
  const T=[["notes","Notes"],["devoirs","Devoirs"],["abs","Absences"],["stud","Étudiants"]];
  let h='';
  if(admin)h+='<div class="card adm" style="display:block"><p><b>Mode administrateur.</b> '+(dirty?"Tu as des changements non publiés.":"Tout est publié.")+'</p><div style="margin-top:12px"><button class="pubbtn '+pst+'" data-a="publish" '+((pst==="busy"||pst==="ok"||(pst==="idle"&&!dirty))?"disabled":"")+'>'+PUBICON[pst]+'<span>'+PUBLBL[pst]+'</span></button></div><div class="row"><button class="ghost" data-a="gh">Réglages GitHub</button><button class="ghost" data-a="exp">Exporter data.json</button><button class="ghost" data-a="reset">Repartir de la version publiée</button></div></div>';
  if(msg)h+='<p class="sub">'+esc(msg)+'</p>';
  h+='<div class="tabs">'+T.map(t=>'<button class="'+(tab===t[0]?"on":"")+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';
  h+=tab==="notes"?vNotes():tab==="devoirs"?vDevoirs():tab==="abs"?vAbs():vStud();
  h+='<p style="text-align:center"><button class="x" style="color:var(--mut);font-size:.85rem" data-a="adm">'+(admin?"Quitter l’espace administrateur":"Espace administrateur")+'</button></p>';$("app").innerHTML=h;
  if($("flt"))$("flt").value=sel;
  if(admin&&tab==="notes"){if(document.querySelector("input[data-fs]"))refreshFN();if($("ar_q"))applyAR();}
}
function touch(){dirty=true;msg="";try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}render();}
const PH="44ab13aaeeb46225cf8bcebed6af659f1abfd7060592c87683ca4f8c9e5ebf82",SALT="seg-2026";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function openPad(check){
  return new Promise(res=>{
    let v="";
    const o=document.createElement("div");o.className="ov";

  function curI(){return interros().find(function(x){return x.k===S.k;});}

  function html(){
    var L=interros(),I=L.find(function(x){return x.k===S.k;}),st=sorted(),q=norm(S.q);
    var h='<details class="card" data-co="1" '+(S.o?"open":"")+'><summary><b>✏️ Corriger une interro déjà enregistrée</b></summary><p class="sub" style="margin:8px 0 0">Choisis l’interro : tous les étudiants s’affichent avec leur note actuelle. Corrige une erreur, ou remplis la note d’un étudiant qui n’en avait pas (ou qui avait 0 par erreur). Seules les lignes que tu changes sont modifiées : toutes les autres notes restent exactement comme elles sont.</p>';
    if(!L.length)return h+'<p class="empty">Aucune note enregistrée pour le moment.</p></details>';
    h+='<div class="row"><select data-cf="k"><option value="">Choisis une interro…</option>'+L.map(function(x){
      var miss=st.filter(function(s){return !x.byS[s.id];}).length;
      return '<option value="'+esc(x.k)+'"'+(x.k===S.k?" selected":"")+'>'+esc((x.subject||"Sans matière")+" · "+x.title+" · "+fd(x.date)+(miss?" · "+miss+" sans note":""))+'</option>';
    }).join("")+'</select></div>';
    if(!I)return h+'</details>';
    h+='<p class="sub" style="margin:10px 0 0">'+esc((I.subject||"Sans matière")+" · "+I.title+(I.teacher?" · "+I.teacher:"")+" · sur "+I.max+" · "+fd(I.date))+'</p>';
    var F=[["all","Tous les étudiants"],["none","Sans note seulement"],["zero","Notes à 0 seulement"]];
    h+='<div class="row"><select data-cf="f">'+F.map(function(x){return '<option value="'+x[0]+'"'+(S.f===x[0]?" selected":"")+'>'+x[1]+'</option>';}).join("")+'</select><input data-cq="1" type="search" placeholder="Chercher un étudiant" value="'+esc(S.q)+'"></div><div style="margin-top:8px">';
    var rows=st.filter(function(s){
      var ex=I.byS[s.id];
      return S.f==="none"?!ex:S.f==="zero"?(!!ex&&ex.score===0):true;
    });
    h+=rows.length?rows.map(function(s){
      var ex=I.byS[s.id],v=(s.id in S.sc)?S.sc[s.id]:(ex?String(ex.score):"");
      return '<label class="fr" data-nm="'+esc(norm(s.name))+'"'+(q&&norm(s.name).indexOf(q)<0?' style="display:none"':"")+'><span>'+esc(s.name)+'</span><em class="stt"></em><input class="sc" enterkeyhint="next" type="number" inputmode="decimal" step="0.25" min="0" data-cs="'+s.id+'" value="'+esc(v)+'" placeholder="—"></label>';
    }).join(""):'<p class="empty">Aucun étudiant dans cette liste.</p>';
    h+='</div>'+(S.m?'<p class="fm'+(S.m.e?" er":"")+'">'+esc(S.m.t)+'</p>':"")+'<div class="row"><button class="act" data-ca="save">Enregistrer les corrections</button></div><p class="sub">Pour supprimer complètement une note, utilise le ✕ dans le tableau plus haut.</p></details>';
    return h;
  }

  function stat(inp,I){
    I=I||curI();if(!I)return;
    var ex=I.byS[inp.dataset.cs],cur=String(inp.value||"").trim(),nv=parseFloat(cur.replace(",",".")),t="",c="";
    if(ex){
      if(cur===""){t="vide : inchangée";c="n";}
      else if(nv!==ex.score){t="modifiée ("+ex.score+" → "+cur+")";c="m";}
      else if(ex.score===0){t="0 : à vérifier";c="m";}
    }else{
      if(cur!==""){t="nouvelle";c="d";}else{t="sans note";c="n";}
    }
    var s=inp.closest(".fr").querySelector(".stt");
    if(s){s.textContent=t;s.className="stt "+c;}
    inp.className="sc "+c;
  }
  function refresh(){
    var I=curI();
    document.querySelectorAll("input[data-cs]").forEach(function(i){stat(i,I);});
  }

  function save(){
    var I=curI();
    if(!I){S.m={t:"Choisis d’abord une interro.",e:true};render();return;}
    var L=[];
    for(var i=0;i<D.students.length;i++){
      var s=D.students[i];
      if(!(s.id in S.sc))continue;
      var v=String(S.sc[s.id]).replace(",",".").trim();
      if(v==="")continue;
      var n=parseFloat(v),ex=I.byS[s.id],mx=ex?ex.max:(I.max||20);
      if(isNaN(n)||n<0||n>mx){S.m={t:"Vérifie la note de "+s.name+" (entre 0 et "+mx+").",e:true};render();return;}
      L.push({s:s,n:n,ex:ex});
    }
    var na=0,nm=0;
    L.forEach(function(x){
      if(!x.ex){
        var o={id:uid(),sid:x.s.id,subject:I.subject,title:I.title,teacher:I.teacher,score:x.n,max:I.max||20,date:I.date||today()};
        if(I.allH)o.h=true;
        D.notes.push(o);na++;
      }else if(x.ex.score!==x.n){x.ex.score=x.n;nm++;}
    });
    S.sc={};
    if(na||nm){
      var p=[];
      if(na)p.push(na+" ajoutée(s)");
      if(nm)p.push(nm+" modifiée(s)");
      touch();
      S.m={t:p.join(", ")+". Clique sur « Publier pour la classe » pour les envoyer.",e:false};
    }else S.m={t:"Aucun changement : rien n’a été modifié.",e:false};
    render();
  }

  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-ca]");
    if(b&&admin)save();
  });
  document.addEventListener("change",function(e){
    var t=e.target;
    if(!t.dataset||!t.dataset.cf)return;
    if(t.dataset.cf==="k"){S.k=t.value;S.sc={};S.q="";S.f="all";S.m=null;}
    else S.f=t.value;
    render();
  });
  document.addEventListener("input",function(e){
    var t=e.target,d=t.dataset;
    if(!d)return;
    if(d.cs!==undefined){S.sc[d.cs]=t.value;stat(t);}
    else if(d.cq!==undefined){
      S.q=t.value;
      var qq=norm(t.value);
      t.closest("details").querySelectorAll(".fr").forEach(function(r){r.style.display=(!qq||r.dataset.nm.indexOf(qq)>-1)?"":"none";});
    }
  });
  document.addEventListener("toggle",function(e){
    if(e.target.dataset&&e.target.dataset.co)S.o=e.target.open;
  },true);

  var _fast=window.fastNotes;
  window.fastNotes=function(){return _fast()+html();};
  var _render=window.render;
  window.render=function(){
    _render();
    if(admin&&tab==="notes"&&document.querySelector("input[data-cs]"))refresh();
  };
})();</script>
</body>
</html>
