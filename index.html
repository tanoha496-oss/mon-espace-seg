<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace SEG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f8b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html{background:radial-gradient(circle at 12% 8%,rgba(34,211,238,.35),transparent 45%),radial-gradient(circle at 90% 92%,rgba(236,72,153,.3),transparent 48%),linear-gradient(160deg,#1e1b4b,#4338ca 58%,#7c3aed) fixed;background-color:#1e1b4b}
html body{--card:rgba(255,255,255,.1);--bg:rgba(255,255,255,.1);--tx:#f5f3ff;--mut:#c9c6f2;--ac:#8b7cf8;--ac2:#22d3ee;--bd:rgba(255,255,255,.22);--ok:#86efac;--bad:#fca5a5;background:transparent;color-scheme:dark;min-height:100vh}
html body .card,html body .tabs button{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html body .pad{background:rgba(30,27,75,.94)}
html body .pubbtn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 18px rgba(99,102,241,.4)}
html body .fm{color:#a5f3fc}
html body select option{color:#111}
:root{--bg:#f3f5f7;--card:#fff;--tx:#14213d;--mut:#5f6b7a;--ac:#1f6f8b;--ac2:#e07a1f;--bd:#dde2e8;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18222f;--tx:#e8edf3;--mut:#9aa7b6;--ac:#5bb3d0;--ac2:#f0a04b;--bd:#2a3646;--ok:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18222f;--tx:#e8edf3;--mut:#9aa7b6;--ac:#5bb3d0;--ac2:#f0a04b;--bd:#2a3646;--ok:#69db7c;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.low{color:var(--bad)}.good{color:var(--ok)}
.empty{color:var(--mut);padding:8px 0}
select,input{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row input,.row select{flex:1 1 130px}
button.act{padding:9px 14px;border:0;border-radius:8px;background:var(--ac2);color:#14213d;font:inherit;font-weight:700;cursor:pointer}
button.pub{background:var(--ac);color:#fff}
button.pub:disabled{opacity:.45;cursor:default}
button.x{border:0;background:none;color:var(--bad);font-size:1.1rem;cursor:pointer;padding:0 6px}
.adm{border-left:4px solid var(--ac2);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.adm p{margin:0;font-size:.9rem}
.big{font-size:1.6rem;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(4px)}
.pad{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px 20px 18px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pad h2{margin:0 0 4px;font-size:1.2rem}
.pad p{margin:0 0 16px;color:var(--mut);font-size:.9rem;min-height:1.4em}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 20px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ac);display:block}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:60px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:600 1.5rem system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.keys button:active{background:var(--ac);border-color:var(--ac);color:#fff}
.keys .ok{background:var(--ac2);border-color:var(--ac2);color:#14213d}
.pad .cancel{margin-top:14px;background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 12px}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.pubbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 22px;border:0;border-radius:14px;font:700 1.05rem system-ui,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f6f8b,#2b94b8);box-shadow:0 6px 18px rgba(31,111,139,.35);transition:transform .15s,box-shadow .15s,background .3s}
.pubbtn:active{transform:scale(.97)}
.pubbtn:disabled{opacity:.5;cursor:default;box-shadow:none}
.pubbtn.ok{background:linear-gradient(135deg,#2b8a3e,#40a65a)}
.pubbtn.ok:disabled{opacity:1}
.pubbtn.err{background:linear-gradient(135deg,#c92a2a,#e04b4b)}
.pubbtn svg{width:22px;height:22px;flex:none}
.spin{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
details.card summary{cursor:pointer;list-style:none;padding:4px 0}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";float:right;color:var(--mut)}
details[open].card summary::after{content:"▴"}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.fr span{flex:1;min-width:0;font-size:.92rem}
.fr input.sc{width:88px;text-align:right;flex:none}
.fr input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac2);flex:none;padding:0}
.fm{margin:10px 0 0;font-size:.9rem;font-weight:600;color:var(--ac)}
.fm.er{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Mon espace SEG</h1>
<p class="sub" id="upd"></p>
<div id="app"></div>
</main>
<script>
let D={updated:"",students:[],notes:[],devoirs:[],absences:[]};const LS="seg_admin_draft";
let pst="idle",tab="notes",admin=false,dirty=false,sel="all",msg="";
const $=id=>document.getElementById(id);
const g=id=>($(id)?$(id).value.trim():"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const sname=id=>(D.students.find(s=>s.id===id)||{name:"?"}).name;
const fd=d=>d?d.split("-").reverse().join("/"):"";
const opts=()=>[...D.students].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
const del=(k,id)=>admin?'<button class="x" data-a="del" data-k="'+k+'" data-i="'+id+'" title="Supprimer">✕</button>':"";

function vNotes(){
  const rows=D.notes.filter(n=>sel==="all"||n.sid===sel).sort((a,b)=>b.date.localeCompare(a.date));
  let avg="";
  if(sel!=="all"&&rows.length){
    const m=rows.reduce((t,n)=>t+n.score/n.max*20,0)/rows.length;
    avg='<p>Moyenne sur 20 : <span class="big">'+m.toFixed(2).replace(".",",")+'</span></p>';
  }
  let h='<div class="card"><select id="flt"><option value="all">Toute la classe</option>'+opts()+'</select>'+avg;
  h+=rows.length?'<div class="scroll"><table><tr><th>Étudiant</th><th>Matière</th><th>Interro</th><th>Docteur</th><th>Note</th><th>Date</th><th></th></tr>'+rows.map(n=>'<tr><td>'+esc(sname(n.sid))+'</td><td>'+esc(n.subject)+'</td><td>'+esc(n.title)+'</td><td>'+esc(n.teacher||"")+'</td><td class="num '+(n.score/n.max<.5?"low":"good")+'">'+n.score+'/'+n.max+'</td><td>'+fd(n.date)+'</td><td>'+del("notes",n.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucune note pour le moment.</p>';
  h+='</div>';
  if(admin)h+=fastNotes();
  if(admin)h+='<div class="card"><b>Ajouter une note</b><div class="row"><select id="n_s">'+opts()+'</select><input id="n_m" placeholder="Matière"><input id="n_t" placeholder="Intitulé (ex. Interro 2)"><input id="n_e" placeholder="Docteur (ex. Dr Koffi)"><input id="n_sc" type="number" step="0.25" placeholder="Note"><input id="n_x" type="number" value="20" placeholder="Sur"><input id="n_d" type="date" value="'+today()+'"></div><div class="row"><button class="act" data-a="addn">Ajouter la note</button></div></div>';
  return h;
}
function vDevoirs(){
  const rows=[...D.devoirs].sort((a,b)=>a.due.localeCompare(b.due));
  let h='<div class="card">';
  h+=rows.length?'<div class="scroll"><table><tr><th>À rendre le</th><th>Matière</th><th>Devoir</th><th></th></tr>'+rows.map(d=>'<tr><td class="num">'+fd(d.due)+'</td><td>'+esc(d.subject)+'</td><td>'+esc(d.title)+'</td><td>'+del("devoirs",d.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucun devoir à rendre.</p>';
  h+='</div>';
  if(admin)h+='<div class="card"><b>Ajouter un devoir</b><div class="row"><input id="d_m" placeholder="Matière"><input id="d_t" placeholder="Devoir à faire"><input id="d_d" type="date" value="'+today()+'"></div><div class="row"><button class="act" data-a="addd">Ajouter le devoir</button></div></div>';
  return h;
}
function vAbs(){
  const tot=D.students.map(s=>({s,h:D.absences.filter(a=>a.sid===s.id).reduce((t,a)=>t+a.hours,0)})).sort((a,b)=>b.h-a.h);
  let h='<div class="card"><b>Total par étudiant</b><div class="scroll"><table><tr><th>Étudiant</th><th>Heures d’absence</th></tr>'+tot.map(t=>'<tr><td>'+esc(t.s.name)+'</td><td class="num '+(t.h>=10?"low":"")+'">'+t.h+' h</td></tr>').join("")+'</table></div></div>';
  const rows=[...D.absences].sort((a,b)=>b.date.localeCompare(a.date));
  h+='<div class="card"><b>Détail</b>'+(rows.length?'<div class="scroll"><table><tr><th>Date</th><th>Étudiant</th><th>Heures</th><th>Motif</th><th></th></tr>'+rows.map(a=>'<tr><td>'+fd(a.date)+'</td><td>'+esc(sname(a.sid))+'</td><td class="num">'+a.hours+' h</td><td>'+esc(a.reason||"")+'</td><td>'+del("absences",a.id)+'</td></tr>').join("")+'</table></div>':'<p class="empty">Aucune absence enregistrée.</p>')+'</div>';
  if(admin)h+=fastAbs();
  if(admin)h+='<div class="card"><b>Ajouter une absence</b><div class="row"><select id="b_s">'+opts()+'</select><input id="b_h" type="number" step="0.5" placeholder="Heures"><input id="b_d" type="date" value="'+today()+'"><input id="b_r" placeholder="Motif (facultatif)"></div><div class="row"><button class="act" data-a="addb">Ajouter l’absence</button></div></div>';
  return h;
}
function vStud(){
  let h='<div class="card"><b>Étudiants de la classe ('+D.students.length+')</b><table>'+[...D.students].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+del("students",s.id)+'</td></tr>').join("")+'</table></div>';
  if(admin)h+='<div class="card"><b>Ajouter des étudiants</b><p class="sub">Un nom par ligne : tu peux coller toute la liste de la classe d’un coup.</p><textarea id="s_n" rows="6" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)" placeholder="Nom Prénom"></textarea><div class="row"><button class="act" data-a="adds">Ajouter</button></div></div>';
  return h;
}
function render(){
  $("upd").textContent=D.updated?"Dernière mise à jour : "+D.updated:"Pas encore mis à jour";
  const T=[["notes","Notes"],["devoirs","Devoirs"],["abs","Absences"],["stud","Étudiants"]];
  let h='';
  if(admin)h+='<div class="card adm" style="display:block"><p><b>Mode administrateur.</b> '+(dirty?"Tu as des changements non publiés.":"Tout est publié.")+'</p><div style="margin-top:12px"><button class="pubbtn '+pst+'" data-a="publish" '+((pst==="busy"||pst==="ok"||(pst==="idle"&&!dirty))?"disabled":"")+'>'+PUBICON[pst]+'<span>'+PUBLBL[pst]+'</span></button></div><div class="row"><button class="ghost" data-a="gh">Réglages GitHub</button><button class="ghost" data-a="exp">Exporter data.json</button><button class="ghost" data-a="reset">Repartir de la version publiée</button></div></div>';
  if(msg)h+='<p class="sub">'+esc(msg)+'</p>';
  h+='<div class="tabs">'+T.map(t=>'<button class="'+(tab===t[0]?"on":"")+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';
  h+=tab==="notes"?vNotes():tab==="devoirs"?vDevoirs():tab==="abs"?vAbs():vStud();
  h+='<p style="text-align:center"><button class="x" style="color:var(--mut);font-size:.85rem" data-a="adm">'+(admin?"Quitter l’espace administrateur":"Espace administrateur")+'</button></p>';$("app").innerHTML=h;
  if($("flt"))$("flt").value=sel;
}
function touch(){dirty=true;msg="";try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}render();}
const PH="44ab13aaeeb46225cf8bcebed6af659f1abfd7060592c87683ca4f8c9e5ebf82",SALT="seg-2026";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function openPad(check){
  return new Promise(res=>{
    let v="";
    const o=document.createElement("div");o.className="ov";
    o.innerHTML='<div class="pad" role="dialog" aria-label="Mot de passe"><h2>Espace administrateur</h2><p id="pm">Entre ton mot de passe</p><div class="dots" id="pd"></div><div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join("")+'<button data-k="del" aria-label="Effacer">⌫</button><button data-k="0">0</button><button class="ok" data-k="ok" aria-label="Valider">✓</button></div><button class="cancel" data-k="x">Annuler</button></div>';
    document.body.appendChild(o);
    const up=()=>{$("pd").innerHTML=v.split("").map(()=>"<i></i>").join("");};
    const end=r=>{document.removeEventListener("keydown",kd);o.remove();res(r);};
    const press=async k=>{
      if(k==="x")return end(false);
      if(k==="ok"){
        if(!v)return;
        if(await check(v))return end(true);
        const p=o.firstChild,m=$("pm");m.textContent="Mot de passe incorrect. Réessaie.";m.style.color="var(--bad)";
        p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");v="";up();return;
      }
      if(k==="del")v=v.slice(0,-1);else if(v.length<30)v+=k;
      up();
    };
    const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Enter")press("ok");else if(e.key==="Escape")press("x");};
    o.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)press(b.dataset.k);});
    document.addEventListener("keydown",kd);
    up();
  });
}
async function toggleAdmin(){
  if(admin){admin=false;try{localStorage.setItem("seg_admin","0")}catch(e){}render();return;}
  const ok=await openPad(async p=>{try{return (await sha(p.trim()))===PH;}catch(e){return false;}});
  if(ok){admin=true;msg="";try{localStorage.setItem("seg_admin","1");const d=localStorage.getItem(LS);if(d){D=JSON.parse(d);dirty=true;}}catch(e){}}
  render();
}
const OWNER="tanoha496-oss",REPO="mon-espace-seg",BR="main",FILE="data.json";
const SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const PUBICON={idle:SV+'<path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>',busy:SV.replace("<svg ","<svg class=\"spin\" ")+'<path d="M12 3a9 9 0 1 0 9 9"/></svg>',ok:SV+'<path d="M5 13l4 4L19 7"/></svg>',err:SV+'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>'};
const PUBLBL={idle:"Publier pour la classe",busy:"Publication…",ok:"Publié",err:"Réessayer"};
function b64(s){const b=new TextEncoder().encode(s);let r="";b.forEach(x=>r+=String.fromCharCode(x));return btoa(r);}
function askToken(){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="ov";
    let has="";try{has=localStorage.getItem("seg_gh")||"";}catch(e){}
    o.innerHTML='<div class="pad" role="dialog" aria-label="Connecter GitHub"><h2>Connecter GitHub</h2><p>Colle ta clé d’accès. Elle reste sur cet appareil.</p><input id="gh_t" type="password" autocomplete="off" placeholder="github_pat_…" style="width:100%;margin:0 0 14px"><div class="keys" style="grid-template-columns:1fr"><button class="ok" data-k="ok" style="font-size:1.05rem;height:52px">Enregistrer</button></div>'+(has?'<button class="cancel" data-k="del">Supprimer la clé de cet appareil</button>':"")+'<button class="cancel" data-k="x">Annuler</button></div>';
    document.body.appendChild(o);
    const end=r=>{o.remove();res(r);};
    o.addEventListener("click",e=>{
      const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;
      if(k==="x")end("");
      else if(k==="del"){try{localStorage.removeItem("seg_gh");}catch(x){}end("");}
      else if(k==="ok"){const v=$("gh_t").value.trim();if(!v){$("gh_t").focus();return;}try{localStorage.setItem("seg_gh",v);}catch(x){}end(v);}
    });
    $("gh_t").focus();
  });
}
async function publishGH(){
  let tk="";try{tk=localStorage.getItem("seg_gh")||"";}catch(e){}
  if(!tk){tk=await askToken();if(!tk){render();return;}}
  pst="busy";msg="";render();
  const H={Authorization:"Bearer "+tk,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const url="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+FILE;
  try{
    D.updated=new Date().toLocaleDateString("fr-FR");
    const body=JSON.stringify(D,null,1);
    const g=await fetch(url+"?ref="+BR,{headers:H,cache:"no-store"});
    let sha;
    if(g.ok){sha=(await g.json()).sha;}else if(g.status!==404)throw g;
    const r=await fetch(url,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify({message:"Mise à jour des données",content:b64(body),sha:sha,branch:BR})});
    if(!r.ok)throw r;
    dirty=false;
    try{const j=JSON.stringify(D);localStorage.setItem(LS,j);localStorage.setItem("seg_pub",j);}catch(e){}
    pst="ok";msg="Publié ! La classe verra les changements dans une à deux minutes.";
  }catch(e){
    pst="err";const st=e&&e.status;
    msg=(st===401||st===403)?"GitHub a refusé la clé. Vérifie-la dans Réglages GitHub.":st===404?"Dépôt introuvable : vérifie les droits de la clé.":"La publication a échoué. Vérifie ta connexion et réessaie.";
  }
  render();
  if(pst==="ok")setTimeout(()=>{pst="idle";render();},4000);
}
let FM={n:null,a:null};
const FQ={n:{m:"",t:"",x:"20",d:today(),q:"",sc:{}},a:{d:today(),h:"2",r:"",q:"",ab:{}},o:{n:false,a:false}};
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sorted(){return [...D.students].sort((a,b)=>a.name.localeCompare(b.name,"fr"));}
function fmsg(k){return FM[k]?'<p class="fm'+(FM[k].e?" er":"")+'">'+esc(FM[k].t)+'</p>':"";}
function fastNotes(){
  const q=norm(FQ.n.q),st=sorted();
  let h='<details class="card" data-fo="n" '+(FQ.o.n?"open":"")+'><summary><b>Saisie rapide de toute la classe</b></summary><p class="sub" style="margin:8px 0 0">Remplis une fois la matière et l’intitulé, puis tape la note de chaque étudiant. Laisse vide ceux qui n’en ont pas.</p><div class="row"><input data-fn="m" placeholder="Matière" value="'+esc(FQ.n.m)+'"><input data-fn="t" placeholder="Intitulé (ex. Interro 2)" value="'+esc(FQ.n.t)+'"><input data-fn="e" placeholder="Docteur (ex. Dr Koffi)" value="'+esc(FQ.n.e||"")+'"><input data-fn="x" type="number" placeholder="Sur" value="'+esc(FQ.n.x)+'"><input data-fn="d" type="date" value="'+esc(FQ.n.d)+'"></div><div class="row"><input data-fq="n" type="search" placeholder="Chercher un étudiant" value="'+esc(FQ.n.q)+'"></div><div style="margin-top:8px">';
  h+=st.length?st.map(s=>'<label class="fr" data-nm="'+esc(norm(s.name))+'"'+(q&&!norm(s.name).includes(q)?' style="display:none"':"")+'><span>'+esc(s.name)+'</span><input class="sc" type="number" inputmode="decimal" step="0.25" min="0" data-fs="'+s.id+'" value="'+esc(FQ.n.sc[s.id]||"")+'" placeholder="—"></label>').join(""):'<p class="empty">Ajoute d’abord les étudiants dans l’onglet Étudiants.</p>';
  return h+'</div>'+fmsg("n")+'<div class="row"><button class="act" data-a="fastn">Enregistrer les notes</button></div></details>';
}
function fastAbs(){
  const q=norm(FQ.a.q),st=sorted();
  const cnt=Object.values(FQ.a.ab).filter(Boolean).length;
  let h='<details class="card" data-fo="a" '+(FQ.o.a?"open":"")+'><summary><b>Saisie rapide des absents</b></summary><p class="sub" style="margin:8px 0 0">Choisis la date et la durée du cours, puis coche seulement les étudiants absents.</p><div class="row"><input data-fa="d" type="date" value="'+esc(FQ.a.d)+'"><input data-fa="h" type="number" step="0.5" placeholder="Durée (h)" value="'+esc(FQ.a.h)+'"><input data-fa="r" placeholder="Matière ou motif (facultatif)" value="'+esc(FQ.a.r)+'"></div><div class="row"><input data-fq="a" type="search" placeholder="Chercher un étudiant" value="'+esc(FQ.a.q)+'"></div><div style="margin-top:8px">';
  h+=st.length?st.map(s=>'<label class="fr" data-nm="'+esc(norm(s.name))+'"'+(q&&!norm(s.name).includes(q)?' style="display:none"':"")+'><span>'+esc(s.name)+'</span><input type="checkbox" data-fb="'+s.id+'" '+(FQ.a.ab[s.id]?"checked":"")+'></label>').join(""):'<p class="empty">Ajoute d’abord les étudiants dans l’onglet Étudiants.</p>';
  return h+'</div><p class="sub" id="ab_c">'+cnt+' absent(s) sélectionné(s)</p>'+fmsg("a")+'<div class="row"><button class="act" data-a="fasta">Enregistrer les absences</button></div></details>';
}
function saveFastN(){
  const f=FQ.n,mx=parseFloat(f.x)||20;
  if(!f.m.trim()||!f.t.trim()){FM.n={t:"Remplis la matière et l’intitulé.",e:true};render();return;}
  const add=[];
  for(const s of D.students){
    const v=String(f.sc[s.id]||"").replace(",",".").trim();
    if(v==="")continue;
    const n=parseFloat(v);
    if(isNaN(n)||n<0||n>mx){FM.n={t:"Vérifie la note de "+s.name+" (entre 0 et "+mx+").",e:true};render();return;}
    add.push({id:uid(),sid:s.id,subject:f.m.trim(),title:f.t.trim(),teacher:(f.e||"").trim(),teacher:(f.e||"").trim(),score:n,max:mx,date:f.d||today()});
  }
  if(!add.length){FM.n={t:"Aucune note saisie.",e:true};render();return;}
  add.forEach(x=>D.notes.push(x));
  f.sc={};f.t="";
  touch();
  FM.n={t:add.length+" notes ajoutées. Clique sur « Publier pour la classe » pour les envoyer.",e:false};render();
}
function saveFastA(){
  const f=FQ.a,h=parseFloat(String(f.h).replace(",","."));
  if(isNaN(h)||h<=0){FM.a={t:"Indique la durée du cours (en heures).",e:true};render();return;}
  const ids=D.students.filter(s=>f.ab[s.id]).map(s=>s.id);
  if(!ids.length){FM.a={t:"Coche au moins un étudiant absent.",e:true};render();return;}
  ids.forEach(id=>D.absences.push({id:uid(),sid:id,hours:h,date:f.d||today(),reason:(f.r||"").trim()}));
  f.ab={};
  touch();
  FM.a={t:ids.length+" absence(s) ajoutée(s). Clique sur « Publier pour la classe » pour les envoyer.",e:false};render();
}
function exportData(){
  D.updated=new Date().toLocaleDateString("fr-FR");
  const b=new Blob([JSON.stringify(D,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="data.json";document.body.appendChild(a);a.click();a.remove();
  msg="Fichier data.json téléchargé. Envoie-le maintenant sur GitHub pour que la classe voie les changements.";render();
}
async function load(){
  let ok=false;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(r.ok){D=await r.json();ok=true;}}catch(e){}
  if(!ok)msg="Impossible de charger les données. Vérifie ta connexion.";
  try{if(localStorage.getItem("seg_admin")==="1"){admin=true;const d=localStorage.getItem(LS);if(d){D=JSON.parse(d);dirty=d!==localStorage.getItem("seg_pub");}}}catch(e){}
  render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="tab"){tab=b.dataset.v;FM={n:null,a:null};render();}
  else if(a==="exp")exportData();
  else if(a==="adm"){toggleAdmin();}
  else if(!admin)return;
  else if(a==="reset"){try{localStorage.removeItem(LS);localStorage.removeItem("seg_pub")}catch(e){}location.reload();}
  else if(a==="publish"){if(pst!=="busy")publishGH();}
  else if(a==="fastn"){saveFastN();}
  else if(a==="fasta"){saveFastA();}
  else if(a==="gh"){askToken().then(v=>{msg=v?"Clé enregistrée sur cet appareil.":"";render();});}
  else if(a==="del"){const k=b.dataset.k;D[k]=D[k].filter(x=>x.id!==b.dataset.i);touch();}
  else if(a==="addn"){const sc=parseFloat(g("n_sc")),mx=parseFloat(g("n_x"))||20;if(isNaN(sc)||!g("n_t"))return;D.notes.push({id:uid(),sid:g("n_s"),subject:g("n_m"),title:g("n_t"),teacher:g("n_e"),score:sc,max:mx,date:g("n_d")||today()});touch();}
  else if(a==="addd"){if(!g("d_t"))return;D.devoirs.push({id:uid(),subject:g("d_m"),title:g("d_t"),due:g("d_d")||today()});touch();}
  else if(a==="addb"){const h=parseFloat(g("b_h"));if(isNaN(h))return;D.absences.push({id:uid(),sid:g("b_s"),hours:h,date:g("b_d")||today(),reason:g("b_r")});touch();}
  else if(a==="adds"){const L=($("s_n")?$("s_n").value:"").split("\n").map(x=>x.trim()).filter(Boolean);if(!L.length)return;L.forEach(n=>D.students.push({id:uid(),name:n}));touch();}
});
document.addEventListener("change",e=>{if(e.target.id==="flt"){sel=e.target.value;render();}else if(e.target.dataset&&e.target.dataset.fb){FQ.a.ab[e.target.dataset.fb]=e.target.checked;const c=$("ab_c");if(c)c.textContent=Object.values(FQ.a.ab).filter(Boolean).length+" absent(s) sélectionné(s)";}});
document.addEventListener("input",e=>{
  const d=e.target.dataset;if(!d)return;
  if(d.fn){FQ.n[d.fn]=e.target.value;}
  else if(d.fs){FQ.n.sc[d.fs]=e.target.value;}
  else if(d.fa){FQ.a[d.fa]=e.target.value;}
  else if(d.fq){FQ[d.fq].q=e.target.value;const q=norm(e.target.value);e.target.closest("details").querySelectorAll(".fr").forEach(r=>{r.style.display=(!q||r.dataset.nm.includes(q))?"":"none";});}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.fo)FQ.o[d.dataset.fo]=d.open;},true);
load();
</script>
</body>
</html>
